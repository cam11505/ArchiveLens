name: Test and package

on:
  push:
    branches: [main, "codex/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -c constraints-build.txt -e ".[dev]"
      - name: Audit runtime dependency licenses
        run: python scripts/license_audit.py --check
      - name: Prepare bundled RAR backend
        if: runner.os == 'Windows'
        run: python scripts/prepare_backends.py
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
  portable:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-build.txt -e ".[dev,build]"
      - name: Audit packaged runtime dependency licenses
        run: python scripts/license_audit.py --check
      - run: python scripts/prepare_backends.py
      - run: python scripts/prepare_installer_tools.py
      - run: python scripts/prepare_licenses.py
      - run: python scripts/build_portable.py
      - run: python -m build --no-isolation --outdir dist/release
      - run: python scripts/package_release.py
      - run: python scripts/verify_release.py dist/release/ArchiveLens-1.2.1-windows-x64.zip --run --expected-commit ${{ github.sha }}
      - run: python scripts/build_installer.py
      - run: python scripts/verify_installer.py dist/release/ArchiveLens-1.2.1-setup-x64.exe --expected-commit ${{ github.sha }}
      - run: python scripts/release_checksums.py
      - run: python scripts/verify_release_set.py dist/release --expected-commit ${{ github.sha }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ArchiveLens-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ArchiveLens-verification
          path: |
            outputs/release-verification/*
            outputs/installer-verification/*.json
          if-no-files-found: warn
