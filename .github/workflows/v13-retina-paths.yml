name: v1.3 Retina and filesystem qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/v13-retina-paths.yml"
      - "src/**"
      - "tests/test_v13_retina_paths.py"
      - "scripts/qualify_macos_volumes.py"
      - "docs/MACOS_RETINA_PATHS.md"

permissions:
  contents: read

jobs:
  scale-and-paths:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-build.txt -e ".[dev]"
      - name: Record environment and physical QA limits
        run: |
          mkdir -p outputs/retina-paths
          sw_vers > outputs/retina-paths/os.txt
          python --version >> outputs/retina-paths/os.txt
          git rev-parse HEAD > outputs/retina-paths/source-commit.txt
      - name: Real Qt offscreen scale and synthetic display/input regression
        run: |
          for scale in 1 2 3; do
            QT_QPA_PLATFORM=offscreen QT_SCALE_FACTOR=$scale ARCHIVELENS_EXPECTED_DPR=$scale \
              python -m pytest -q tests/test_v13_retina_paths.py \
              --junitxml=outputs/retina-paths/scale-$scale.xml
          done
      - name: Real case-sensitive and insensitive APFS volumes and detach
        run: python scripts/qualify_macos_volumes.py --output outputs/retina-paths
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: v13-retina-paths-evidence
          path: outputs/retina-paths/
          if-no-files-found: error
