name: macOS official candidate (credentials required)

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit (40 lowercase hexadecimal characters)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-official-candidate
  cancel-in-progress: false

jobs:
  official:
    if: github.ref == 'refs/heads/main'
    environment: macos-release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Require exact reviewed main commit and external credentials
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ['EXPECTED_COMMIT']
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if not re.fullmatch('[a-f0-9]{40}', expected) or actual != expected:
              raise SystemExit('Expected exact reviewed main commit')
          if not all(os.environ.get(name) for name in (
              'CERTIFICATE', 'CERTIFICATE_PASSWORD', 'SIGNING_IDENTITY',
              'TEAM_ID', 'APPLE_ID', 'APPLE_PASSWORD'
          )):
              raise SystemExit('Missing official credentials; unsigned fallback is forbidden')
          PY
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -c constraints-build.txt -e ".[dev,build]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Stage audited licenses and approved backend
        run: |
          python scripts/license_audit.py --check
          python scripts/prepare_backends.py
          python scripts/prepare_licenses.py
      - name: Sign, notarize, staple and verify official candidate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: >-
          python scripts/macos_release.py official
          --expected-commit "$EXPECTED_COMMIT"
          --report outputs/macos-official/report.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        # Success only. No unsigned/failed candidate can pass this upload gate.
        with:
          name: ArchiveLens-macos-arm64-official-candidate
          path: |
            dist/macos-official-candidate/*.dmg
            outputs/macos-official/report.json
          if-no-files-found: error
