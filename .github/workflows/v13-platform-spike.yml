name: v1.3 platform spike

on:
  workflow_dispatch:
  push:
    branches: ["codex/v1.3-issue-42"]
    paths:
      - ".github/workflows/v13-platform-spike.yml"
      - "constraints-build.txt"
      - "pyproject.toml"
      - "scripts/v13_platform_diagnostic.py"
      - "src/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  source-and-frozen-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            required_machine: x86_64
          - os: macos-15
            artifact: macos-arm64
            required_machine: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install -c constraints-build.txt -e ".[dev,build]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Source diagnostic
        run: >-
          python scripts/v13_platform_diagnostic.py
          --output outputs/v13-platform/source.json
          --require-machine ${{ matrix.required_machine }}
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build minimal frozen diagnostic
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --name ArchiveLens-v13-diagnostic
          --paths src
          scripts/v13_platform_diagnostic.py
      - name: Run frozen diagnostic
        run: >-
          ./dist/ArchiveLens-v13-diagnostic/ArchiveLens-v13-diagnostic
          --output outputs/v13-platform/frozen.json
          --require-machine ${{ matrix.required_machine }}
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Record executable architecture
        run: file dist/ArchiveLens-v13-diagnostic/ArchiveLens-v13-diagnostic | tee outputs/v13-platform/executable.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: ArchiveLens-v13-spike-${{ matrix.artifact }}
          path: |
            outputs/v13-platform/*
            build/ArchiveLens-v13-diagnostic/warn-ArchiveLens-v13-diagnostic.txt
          if-no-files-found: error
