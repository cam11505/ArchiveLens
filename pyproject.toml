[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "archivelens"
version = "1.2.2"
description = "Read images, comics, folders and PDFs locally without modifying sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6>=6.8,<7",
    "Pillow>=12.3,<13",
    "pyzipper>=0.4,<0.5",
    "py7zr>=1.1.3,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
build = ["pyinstaller>=6.19,<7", "build>=1.2,<2"]

[project.gui-scripts]
archivelens = "archivelens.main:main"

[project.scripts]
archivelens-list = "archivelens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
